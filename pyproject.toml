[project]
name = "volleyball-trim"
version = "0.1.0"
description = "Trim downtime between volleyball serves from game film"
readme = "README.md"
authors = [
    { name = "Cursor Agent", email = "cursoragent@cursor.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.28.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
]

[project.scripts]
volleyball-trim = "volleyball_trim.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
